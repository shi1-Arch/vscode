    <p>新能源汽车电驱系统就是取代燃油车“发动机+变速箱”的核心动力单元，

        的电能高效转化为车轮的机械能。 2026年上半年国内新能源乘用车电
        驱系统装机量中，弗迪动力以约64万套领跑， 蔚来 、华为数字能源、
