<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角-特殊场景</title>
    <style>
        img{
            width: 200px;
            height: 200px;

            /*正圆形必须是正方形盒子，设置圆角属性为 宽高的一半/50%*/

            /*border-radius: 100px;*/

            /*最大值是50%，超过后无效果*/
            border-radius: 50%;
        }
        div{
            width: 200px;
            height: 80px;
            background-color: olivedrab;

            /*胶囊形状，长方形盒子 设置圆角属性值为 盒子高度的一半*/

            border-radius: 40px;
        }
    </style>
</head>
<body>
    <!--正圆形--头像-->
    <img src="../images/2.gif" alt="">

    <!--胶囊状-->
    <div></div>
</body>
</html>
