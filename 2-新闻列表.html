<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻列表</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li{
            list-style: none;
        }
        a{
            text-decoration: none;
        }
        .news{
            margin: 100px auto;
            width: 360px;
            height: 200px;
            background-color: pink;

        }
        .news .hd{
            height: 34px;
            background-color: #eee;
            border: 1px solid #dbdee1;
            border-left: 0;
        }
        .news .hd a{
            display: block;
            border-top: 3px solid #ff8400;
            width: 50px;
            height: 40px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="news">
    <!--新闻区域 包含 标题 + 内容-->
        <div class="hd"><a href="#">新闻</a></div>
    </div>
</body>
</html>
