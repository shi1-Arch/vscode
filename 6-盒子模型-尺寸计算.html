<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型-尺寸计算</title>
    /*盒子尺寸=内容尺寸+border尺寸+内边距尺寸*/
    /*给盒子加border/padding 会撑大盒子：
    1.手动做减法 减掉二者尺寸；2.内减模式 设置属性box-sizing:border-box*/
    <style>
        div{
            width: 200px;
            height: 200px;
            /*手动*/
            /*width: 160px;
            height: 160px;*/
            background-color: pink;

            padding: 20px;
            /*内减模式，不需手动*/
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
