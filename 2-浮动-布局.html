<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动-布局</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        li{
            list-style: none;
        
        }

        .product{
            margin: 50px auto;
            width: 1226px;
            height: 628px;
            background-color: rgb(207, 235, 150);
        }

        .left{
            float: left;
            height: 628px;
            width: 234px;
            background-color: rgb(193, 193, 241);


        }
        .right{
            float: right;
            width: 978px;
            height: 628px;
            background-color: rgb(180, 218, 233);

        }
        .right li{
            margin-right: 14px;
            margin-bottom: 14px;
            float: left;
            width: 234px;
            height: 300px;
            background-color: rgb(236, 236, 172);
        }
        /*找到第四个和第八个li，把右侧margin去掉*/
        .right li:nth-child(4n){
            margin-right: 0;
        }

        /* 细节：如果父级宽度不够，浮动的盒子会掉下来*/
    </style>
</head>
<body>
    <!--版心：左右.右面：8个产品→8个li-->
    <div class="product">
        <div class="left"></div>
        <div class="right">
          <ul>
            <li></li> 
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            
          </ul>
        </div>
    </div>
</body>
</html>
