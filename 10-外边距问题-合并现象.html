<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外边距问题-合并现象</title>
    <style>
        .one{
            width: 100px;
            height: 100px;
            background-color: brown;
            margin-bottom: 80px; /*垂直排列的两个盒子若都设置外边距，取较大的值，
            因此只需设置一个*/
        }
        .two{
            width: 100px;
            height: 100px;
            background-color: orange;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="one">one</div>
    <div class="two">two</div>
</body>
</html>
