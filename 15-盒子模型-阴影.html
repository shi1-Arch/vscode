<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阴影</title>
    <style>
        /*属性名 box-shadow*/
        /*默认是外阴影，内阴影需添加 inset*/
        div{
            margin: 50px auto;
            width: 200px;
            height: 80px;
            background-color: olivedrab;

            box-shadow: 2px 5px 10px 1px  rgba(0,0,0,0.5) ;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
