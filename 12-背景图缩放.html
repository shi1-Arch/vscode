<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景图缩放</title>
    <style>
        div{
            width: 800px;
            height: 500px;
            background-color: pink;

            background-image: url(../images/奶龙.jpeg);
            background-repeat: no-repeat;

           /* background-size: contain;*/
            /*contain:如果图的宽跟盒子尺寸相等停止缩放，可能导致盒子有露白*/
            /*cover：图片完全覆盖盒子，可能导致图片展示不全*/

            background-size: 100%;
            /*100% 图片的宽度和盒子一样，高度按图片比例等比缩放*/

            
        }
    </style>
</head>
<body>
    <div>div标签</div>
</body>
</html>
