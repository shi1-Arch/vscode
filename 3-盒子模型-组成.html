<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型-组成</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: pink;

            padding: 20px;/*在盒子四个方向都有内边距*/
            border: 1px solid #000;/*边块线*/
            margin: 40px;/*在盒子四个方向都有外边距，拉开与其他盒子的距离*/

        }
    </style>
</head>
<body>
    <div>div 标签</div>
</body>
</html>
