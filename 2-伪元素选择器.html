<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪元素选择器</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: pink;
        }
        div::before{
            content: "纯纯稚稚";/*content必须设置，若无则为元素选择器不生效*/
            width: 100px;
            height: 100px;
            background-color: green;
            display: block;
        }
        div::after{
            content: "和好";/*content必须设置，若无则为元素选择器不生效*/
            width: 100px;
            height: 100px;
            background-color: #fff;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!--标签内容：纯纯稚稚请和好-->
    <div>请</div>
</body>
</html>
