<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmet写法</title>
    <style>
        div{
            width: 500px;
            background-color: aliceblue;
            width: 500px;
            height: 200px;
            background-color: #fff;
            /*w500+h200+bc*/
            }
    </style>
</head>
<body>
    <!--多首字母代替-->
    <div></div>
    <p class="box"></p>
    <!--标签名.类名-->
    <div class="box"></div>
    <!--div直接.类名回车即可-->
    <p id="box"></p>
    <!--p#box-->
    <div></div>
    <p></p>
    <!--同级用加号连接，父子级用大于号-->
    <span></span><span></span><span></span>
    <!--多个标签 标签名*数量-->
    <div>111</div>
    <!--例如 div{111}-->
</body>
</html>
