<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex布局-修改主轴方向</title>
    <style>
        .box{
            display: flex;
            flex-direction: column;/*修改主轴方向 垂直方向：侧轴自动变换到水平方向*/

            justify-content: center;/*主轴在垂直，视觉效果：垂直居中*/

            align-items: center;/*侧轴在水平，视觉效果：水平居中*/

            width: 150px;
            height: 120px;
            background-color: pink;
        }
        img{
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="../images/奶龙.jpeg" alt="">
        <span>媒体</span>
    </div>
</body>
</html>
