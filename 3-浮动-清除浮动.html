<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动-清除浮动</title>
    <style>
        /*场景：浮动元素脱标，若父级无高度，子级无法撑开父级高度*/
        /*在父级元素内容的最后添加一个块级元素，设置css属性 clear:both*/
        .top{
            margin: 10px auto;
            width: 1200px;
            /*height: 300px;*/
            background-color: rgb(150, 204, 150);

            overflow: hidden ;
        }

        .bottom{
            height: 100px;
            background-color: rgb(232, 169, 169);
        }
        .left{
            float: left;
            width: 200px;
            height: 300px;
            background-color: rgb(159, 209, 228);
        }
        .right{
            float: right;
            width: 950px;
            height: 300px;
            background-color: rgb(241, 211, 155);
        }

        /*额外标签法*/
        /*.clearfix{
            clear: both;
        }*/

        /*单伪元素法   给top标签添加  before解决外边距塌陷问题*/
        /*.clearfix::after{
            content: "";
            display: block;
            clear: both;
        }*/

        /*双伪元素（推荐）  在top后加clearfix*/
        /*.clearfix::before,
        .clearfix::after {
            content: "";
            display: table;
        }

        .clearfix::after {
            clear: both;
        }*/

        /*overflow法  给top的父级加*/





    </style>
</head>
<body>
    <div class="top clearfix">
        <div class="left"></div>
        <div class="right"></div>
        <!--<div class="clearfix"></div>-->
    </div>
    <div class="bottom"></div>
</body>
</html>
